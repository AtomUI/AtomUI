   PublishGalleryGitHubRelease:
      name: Publish Gallery GitHub Release
      if: ${{ inputs.CreateGitHubRelease }}
      needs:
         - Prepare
         - BuildAtomUIGalleryDmgX64Installers
         - BuildAtomUIGalleryDmgArm64Installers
         - BuildAtomUIGalleryAppImageX64Installers
         - BuildAtomUIGalleryAppImageArm64Installers
         - BuildAtomUIGalleryWindowsX64Zip
         - BuildAtomUIGalleryWindowsArm64Zip
      runs-on: ubuntu-latest
      permissions:
         contents: write
      concurrency:
         group: gallery-github-release-${{ inputs.TargetBranch }}
         cancel-in-progress: false
      steps:
         -  name: Checkout release tooling
            uses: actions/checkout@v6
            with:
               ref: ${{ github.sha }}
               persist-credentials: false
         -  name: Download Gallery artifacts from this run
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
            with:
               path: ${{ runner.temp }}/gallery-release-artifacts
         -  name: Publish Gallery assets and README
            shell: pwsh
            env:
               GH_TOKEN: ${{ github.token }}
               RELEASE_TAG: ${{ inputs.TargetBranch }}
               RELEASE_SHA: ${{ needs.Prepare.outputs.release_sha }}
               BUILD_STAMP: ${{ needs.Prepare.outputs.build_stamp }}
            run: |
               ./controlgallery/AtomUIGallery.Desktop/scripts/packaging/Publish-GalleryGitHubRelease.ps1 `
                  -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -Commit $env:RELEASE_SHA `
                  -BuildStamp $env:BUILD_STAMP -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'gallery-release-artifacts')
