name: Build AtomUIGallery Installers
on:
   workflow_dispatch:
      inputs:
         TargetBranch:
            description: 'Target branch to build'
            type: string
            default: 'main'
         BuildConfiguration:
            description: 'Build configuration'
            type: choice
            options:
               - Debug
               - Release
            default: 'Release'
         PublishAot:
            description: 'Publish Gallery with NativeAOT'
            type: boolean
            default: true
env:
   SourceDir: ${{ github.workspace }}
   BuildDir: ${{ github.workspace }}/binaries
   AtomUIToolsSourceDir: ${{ github.workspace }}/binaries/atomuitools-source
   AtomUIToolsBinDir: ${{ github.workspace }}/binaries/atomuitools
   GalleryPublishDir: ${{ github.workspace }}/binaries/gallery_published
   GalleryArtifactsOutputDir: ${{ github.workspace }}/binaries/artifacts_output
   AtomUIToolsMacBin: ${{ github.workspace }}/binaries/atomuitools/AtomUITools.Mac
   AtomUIToolsWinBin: ${{ github.workspace }}/binaries/atomuitools/AtomUITools.Windows
   AtomUIToolsLinuxBin: ${{ github.workspace }}/binaries/atomuitools/AtomUITools.Linux
jobs:
   Prepare:
      name: Prepare release metadata
      runs-on: ubuntu-latest
      outputs:
         build_stamp: ${{ steps.stamp.outputs.build_stamp }}
      steps:
         -  name: Compute build stamp
            id: stamp
            run: echo "build_stamp=$(date -u +%m%d)" >> "$GITHUB_OUTPUT"
   BuildAtomUIGalleryDmgX64Installers:
      name: Build macOS x86_64 DMG Installer
      needs: Prepare
      runs-on: macos-15-intel
      steps:
         -  name: Checkout code
            uses: actions/checkout@v6
            with:
               ref: ${{ inputs.TargetBranch }}
         -  name: Install Apple Certificate
            shell: pwsh
            env:
               CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
               CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
               KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
            run: |
               $certPath = Join-Path $env:RUNNER_TEMP "QinwareCodeSign.p12"
               $bytes = [System.Convert]::FromBase64String($env:CERT_P12_BASE64)
               [System.IO.File]::WriteAllBytes($certPath, $bytes)

               security create-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security default-keychain -s build.keychain
               security unlock-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security set-keychain-settings -lut 21600 build.keychain

               security import $certPath -k build.keychain -P $env:CERT_PASSWORD -T /usr/bin/codesign
               security set-key-partition-list -S apple-tool:,apple: -s -k $env:KEYCHAIN_PASSWORD build.keychain
               Remove-Item $certPath -Force

               Write-Host "Installed certificates:"
               security find-identity -v -p codesigning
         -  name: Setup .NET 10
            uses: actions/setup-dotnet@v5
            with:
               dotnet-version: '10.0.x'
         -  name: Prepare build environment
            shell: pwsh
            run: |
               New-Item -ItemType Directory -Path "${{ env.BuildDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.AtomUIToolsBinDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryPublishDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}/dmg/x64" -Force
               brew untap --force aws/tap azure/bicep
               if ($LASTEXITCODE -ne 0) {
                  Write-Host "Optional Homebrew runner taps were not present or could not be untapped."
                  $global:LASTEXITCODE = 0
               }
               brew install openssl@3
         -  name: Build DMG for osx-x64
            shell: pwsh
            env:
               KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
            run: |
               $galleryScriptsPath = "${{ env.SourceDir }}/controlgallery/AtomUIGallery.Desktop/scripts"
               $galleryPublishDirX64 = "${{ env.GalleryPublishDir }}/osx-x64"

               if (Test-Path "${{ env.SourceDir }}/.artifacts") {
                  Remove-Item -Path "${{ env.SourceDir }}/.artifacts" -Recurse -Force
               }

               Set-Location $galleryScriptsPath
               ./PublishToLocal.ps1 -publishRootPath $galleryPublishDirX64 -runtime osx-x64 -buildType ${{ inputs.BuildConfiguration }} -publishAot '${{ inputs.PublishAot }}'

               security unlock-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security set-keychain-settings -lut 21600 build.keychain

               & "$galleryScriptsPath/packaging/New-GalleryDmg.ps1" `
                  -ConfigPath "$galleryPublishDirX64/config/InstallerConfig.xml" `
                  -PackagesPath "$galleryPublishDirX64/packages" `
                  -OutputPath "${{ env.GalleryArtifactsOutputDir }}/dmg/x64" `
                  -Runtime osx-x64 `
                  -BuildStamp "${{ needs.Prepare.outputs.build_stamp }}" `
                  -CertIdentity "${{ secrets.CERT_IDENTITY }}"

         -  name: Upload x86_64 DMG artifacts
            uses: actions/upload-artifact@v7
            with:
               name: dmg-packages-osx-x64
               path: ${{ env.GalleryArtifactsOutputDir }}/dmg/x64/*.dmg
   
   BuildAtomUIGalleryDmgArm64Installers:
      name: Build macOS arm64 DMG Installer
      needs: Prepare
      runs-on: macos-latest
      steps:
         -  name: Checkout code
            uses: actions/checkout@v6
            with:
               ref: ${{ inputs.TargetBranch }}
         -  name: Install Apple Certificate
            shell: pwsh
            env:
               CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
               CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
               KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
            run: |
               $certPath = Join-Path $env:RUNNER_TEMP "QinwareCodeSign.p12"
               $bytes = [System.Convert]::FromBase64String($env:CERT_P12_BASE64)
               [System.IO.File]::WriteAllBytes($certPath, $bytes)

               security create-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security default-keychain -s build.keychain
               security unlock-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security set-keychain-settings -lut 21600 build.keychain

               security import $certPath -k build.keychain -P $env:CERT_PASSWORD -T /usr/bin/codesign
               security set-key-partition-list -S apple-tool:,apple: -s -k $env:KEYCHAIN_PASSWORD build.keychain
               Remove-Item $certPath -Force

               Write-Host "Installed certificates:"
               security find-identity -v -p codesigning
         -  name: Setup .NET 10
            uses: actions/setup-dotnet@v5
            with:
               dotnet-version: '10.0.x'
         -  name: Prepare build environment
            shell: pwsh
            run: |
               New-Item -ItemType Directory -Path "${{ env.BuildDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.AtomUIToolsBinDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryPublishDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}/dmg/arm64" -Force
               brew untap --force aws/tap azure/bicep
               if ($LASTEXITCODE -ne 0) {
                  Write-Host "Optional Homebrew runner taps were not present or could not be untapped."
                  $global:LASTEXITCODE = 0
               }
               brew install openssl@3
         -  name: Build DMG for osx-arm64
            shell: pwsh
            env:
               KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
            run: |
               $galleryScriptsPath = "${{ env.SourceDir }}/controlgallery/AtomUIGallery.Desktop/scripts"
               $galleryPublishDirArm64 = "${{ env.GalleryPublishDir }}/osx-arm64"

               if (Test-Path "${{ env.SourceDir }}/.artifacts") {
                  Remove-Item -Path "${{ env.SourceDir }}/.artifacts" -Recurse -Force
               }

               Set-Location $galleryScriptsPath
               ./PublishToLocal.ps1 -publishRootPath $galleryPublishDirArm64 -runtime osx-arm64 -buildType ${{ inputs.BuildConfiguration }} -publishAot '${{ inputs.PublishAot }}'

               security unlock-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security set-keychain-settings -lut 21600 build.keychain

               & "$galleryScriptsPath/packaging/New-GalleryDmg.ps1" `
                  -ConfigPath "$galleryPublishDirArm64/config/InstallerConfig.xml" `
                  -PackagesPath "$galleryPublishDirArm64/packages" `
                  -OutputPath "${{ env.GalleryArtifactsOutputDir }}/dmg/arm64" `
                  -Runtime osx-arm64 `
                  -BuildStamp "${{ needs.Prepare.outputs.build_stamp }}" `
                  -CertIdentity "${{ secrets.CERT_IDENTITY }}"

               Get-ChildItem -Path "${{ env.GalleryArtifactsOutputDir }}" | Format-Table
         -  name: Upload arm64 DMG artifacts
            uses: actions/upload-artifact@v7
            with:
               name: dmg-packages-osx-arm64
               path: ${{ env.GalleryArtifactsOutputDir }}/dmg/arm64/*.dmg
   
   BuildAtomUIGalleryAppImageX64Installers:
      name: Build Linux X64 AppImage Installer
      needs: Prepare
      runs-on: ubuntu-latest
      steps:
         -  name: Checkout code
            uses: actions/checkout@v6
            with:
               ref: ${{ inputs.TargetBranch }}
         -  name: Prepare build environment
            shell: pwsh
            run: |
               New-Item -ItemType Directory -Path "${{ env.BuildDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.AtomUIToolsBinDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryPublishDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}/appimage/x64" -Force
               
               sudo apt-get update
               sudo apt-get install -y fuse libfuse2 patchelf desktop-file-utils file clang zlib1g-dev
               sudo apt-get install -y libxcb1 libxcb-shape0 libxcb-shape0-dev xvfb
               
         -  name: Setup .NET 10
            uses: actions/setup-dotnet@v5
            with:
               dotnet-version: '10.0.x'
         -  name: Build AppImage for linux-x64
            shell: pwsh
            run: |
               $galleryScriptsPath = "${{ env.SourceDir }}/controlgallery/AtomUIGallery.Desktop/scripts"
               $galleryPublishDirX64 = "${{ env.GalleryPublishDir }}/linux-x64"
               $appImageOutputDirX64 = "${{ env.GalleryArtifactsOutputDir }}/appimage/x64"

               if (Test-Path "${{ env.SourceDir }}/.artifacts") {
                  Remove-Item -Path "${{ env.SourceDir }}/.artifacts" -Recurse -Force
               }

               Set-Location $galleryScriptsPath
               ./PublishToLocal.ps1 -publishRootPath $galleryPublishDirX64 -runtime linux-x64 -buildType ${{ inputs.BuildConfiguration }} -publishAot '${{ inputs.PublishAot }}'
               
               & "$galleryScriptsPath/packaging/New-GalleryAppImage.ps1" `
                 -ConfigPath "$galleryPublishDirX64/config/InstallerConfig.xml" `
                 -PackagesPath "$galleryPublishDirX64/packages" `
                 -OutputPath $appImageOutputDirX64 `
                 -Runtime linux-x64 `
                 -BuildStamp "${{ needs.Prepare.outputs.build_stamp }}"

               # Smoke test: the extracted AppRun must keep the Gallery running for 20 seconds.
               $smokeDir = Join-Path $env:RUNNER_TEMP "appimage-smoke"
               New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
               $appImage = Get-ChildItem -Path $appImageOutputDirX64 -Filter "*.AppImage" -File | Select-Object -First 1
               Push-Location $smokeDir
               & $appImage.FullName --appimage-extract | Out-Null
               Pop-Location
               xvfb-run -a timeout 20s "$smokeDir/squashfs-root/AppRun"
               if ($LASTEXITCODE -ne 124) {
                  throw "Gallery AppImage exited early with code $LASTEXITCODE."
               }
               $global:LASTEXITCODE = 0
               ls -al $galleryPublishDirX64/packages
               ls -al $appImageOutputDirX64
         -  name: Upload x86_64 AppImage artifacts
            uses: actions/upload-artifact@v7
            with:
               name: linux-appimage-x86_64
               path: ${{ env.GalleryArtifactsOutputDir }}/appimage/x64/*.AppImage
   
