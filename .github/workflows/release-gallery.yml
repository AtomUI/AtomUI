name: Build AtomUIGallery Installers
on:
   workflow_dispatch:
      inputs:
         TargetBranch:
            description: 'Branch or tag to build. Use a version tag to create a GitHub Release.'
            type: string
            default: 'main'
         BuildConfiguration:
            description: 'Build configuration'
            type: choice
            options:
               - Debug
               - Release
            default: 'Release'
         PublishAot:
            description: 'Publish Gallery with NativeAOT'
            type: boolean
            default: true
         CreateGitHubRelease:
            description: 'Create a GitHub Release and attach Gallery installers'
            type: boolean
            default: false
permissions:
   contents: read
env:
   SourceDir: ${{ github.workspace }}
   BuildDir: ${{ github.workspace }}/binaries
   GalleryPublishDir: ${{ github.workspace }}/binaries/gallery_published
   GalleryArtifactsOutputDir: ${{ github.workspace }}/binaries/artifacts_output
jobs:
   Prepare:
      name: Prepare release metadata
      runs-on: ubuntu-latest
      outputs:
         build_stamp: ${{ steps.stamp.outputs.build_stamp }}
         release_sha: ${{ steps.release_source.outputs.sha }}
      steps:
         -  name: Compute build stamp
            id: stamp
            run: echo "build_stamp=$(date -u +%m%d)" >> "$GITHUB_OUTPUT"
         -  name: Validate GitHub Release inputs
            if: ${{ inputs.CreateGitHubRelease }}
            shell: bash
            env:
               RELEASE_TAG: ${{ inputs.TargetBranch }}
               BUILD_CONFIGURATION: ${{ inputs.BuildConfiguration }}
               PUBLISH_AOT: ${{ inputs.PublishAot }}
            run: |
               if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
                  echo "Use an existing version tag such as v6.3.0 to create a GitHub Release." >&2
                  exit 1
               fi
               if [[ "$BUILD_CONFIGURATION" != Release || "$PUBLISH_AOT" != true ]]; then
                  echo "GitHub Releases require the Release configuration and NativeAOT." >&2
                  exit 1
               fi
         -  name: Checkout release tag
            if: ${{ inputs.CreateGitHubRelease }}
            uses: actions/checkout@v6
            with:
               ref: refs/tags/${{ inputs.TargetBranch }}
               persist-credentials: false
         -  name: Pin and validate tagged source
            if: ${{ inputs.CreateGitHubRelease }}
            id: release_source
            shell: pwsh
            env:
               RELEASE_TAG: ${{ inputs.TargetBranch }}
            run: |
               [xml]$versions = Get-Content -Raw -LiteralPath ./build/Versions.props
               if ("v$($versions.Project.PropertyGroup.AtomUIVersion)" -cne $env:RELEASE_TAG) {
                  throw "The Git tag does not match AtomUIVersion in the tagged source."
               }
               $commit = git rev-parse HEAD
               if ($LASTEXITCODE -ne 0) {
                  throw "Could not determine the tagged commit."
               }
               "sha=$commit" >> $env:GITHUB_OUTPUT
   BuildAtomUIGalleryDmgX64Installers:
      name: Build macOS x86_64 DMG Installer
      needs: Prepare
      runs-on: macos-15-intel
      steps:
         -  name: Checkout code
            uses: actions/checkout@v6
            with:
               ref: ${{ inputs.CreateGitHubRelease && needs.Prepare.outputs.release_sha || inputs.TargetBranch }}
         -  name: Install Apple Certificate
            shell: pwsh
            env:
               CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
               CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
               KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
            run: |
               $certPath = Join-Path $env:RUNNER_TEMP "QinwareCodeSign.p12"
               $bytes = [System.Convert]::FromBase64String($env:CERT_P12_BASE64)
               [System.IO.File]::WriteAllBytes($certPath, $bytes)

               security create-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security default-keychain -s build.keychain
               security unlock-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security set-keychain-settings -lut 21600 build.keychain

               security import $certPath -k build.keychain -P $env:CERT_PASSWORD -T /usr/bin/codesign
               security set-key-partition-list -S apple-tool:,apple: -s -k $env:KEYCHAIN_PASSWORD build.keychain
               Remove-Item $certPath -Force

               Write-Host "Installed certificates:"
               security find-identity -v -p codesigning
         -  name: Setup .NET 10 and 11
            uses: actions/setup-dotnet@v5
            with:
               dotnet-version: |
                  10.0.x
                  11.0.x
         -  name: Prepare build environment
            shell: pwsh
            run: |
               New-Item -ItemType Directory -Path "${{ env.BuildDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryPublishDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}" -Force
               New-Item -ItemType Directory -Path "${{ env.GalleryArtifactsOutputDir }}/dmg/x64" -Force
               brew untap --force aws/tap azure/bicep
               if ($LASTEXITCODE -ne 0) {
                  Write-Host "Optional Homebrew runner taps were not present or could not be untapped."
                  $global:LASTEXITCODE = 0
               }
               brew install openssl@3
         -  name: Build DMG for osx-x64
            shell: pwsh
            env:
               KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
               CERT_IDENTITY: ${{ secrets.CERT_IDENTITY }}
            run: |
               $galleryScriptsPath = "${{ env.SourceDir }}/controlgallery/AtomUIGallery.Desktop/scripts"
               $galleryPublishDirX64 = "${{ env.GalleryPublishDir }}/osx-x64"

               if (Test-Path "${{ env.SourceDir }}/.artifacts") {
                  Remove-Item -Path "${{ env.SourceDir }}/.artifacts" -Recurse -Force
               }

               Set-Location $galleryScriptsPath
               ./PublishToLocal.ps1 -publishRootPath $galleryPublishDirX64 -runtime osx-x64 -buildType ${{ inputs.BuildConfiguration }} -publishAot '${{ inputs.PublishAot }}'

               security unlock-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
               security set-keychain-settings -lut 21600 build.keychain

               & "$galleryScriptsPath/packaging/New-GalleryDmg.ps1" `
                  -ConfigPath "$galleryPublishDirX64/config/InstallerConfig.xml" `
                  -PackagesPath "$galleryPublishDirX64/packages" `
                  -OutputPath "${{ env.GalleryArtifactsOutputDir }}/dmg/x64" `
                  -Runtime osx-x64 `
                  -BuildStamp "${{ needs.Prepare.outputs.build_stamp }}" `
                  -CertIdentity $env:CERT_IDENTITY `
                  -RequireSignature

         -  name: Upload x86_64 DMG artifacts
            uses: actions/upload-artifact@v7
            with:
               name: dmg-packages-osx-x64
               path: ${{ env.GalleryArtifactsOutputDir }}/dmg/x64/*.dmg
               if-no-files-found: error
   
